<html>
    <head>
        <title>Buttons</title>
        <link rel="stylesheet" href="06.css">
        <style>
            #Subscribe-btn{
                background-color: red;
                border: 0px;
                color: #ffffff;
                border-radius: 5px;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-inline: 12px;
                margin: 10px 40px;
            }
            #Subscribe-btn:hover{
                background-color: rgb(141, 0, 0);
            }
            .Google-btn:hover{
                background-color: transparent;
                color: #b9b9b9;
            }
        </style>
    </head>
    <body>
        <div>
            <a href="http://youtube.com"><button id="Subscribe-btn">Subscribe</button></a>
        </div>
        <div>
            <a href="http://google.com"><button class="Google-btn"> Google Search</button></a>
            <button onclick="alert('Button was Clicked'); console.log('Button clicked')" >SomeButton</button>
        </div>
    </body>
</html>
