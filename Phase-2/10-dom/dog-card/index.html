<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog-card</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.8.0/axios.min.js"
        integrity="sha512-Rjx/Bee5UEvuxMc3Au6ShLf08nh+v4q3sNCI/+pSzypORWeVZG5jRZBKxM6RlA7L4hbHykwFXhmlBu/cJBaDRg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>
    <div id="card-container">
        <div id="dog-container">
            <img id="dog-img"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ7kVwY6E3UkmCgzAWgtGomGiRCMrGr8ZeYqsWeQUCCgEcPTwYvWzjBTEZljwOScmdW0PuSYcVD5CWmP8WEY5MS_0g9ISItFLhQNXgDMx9XSw&s=10"
                alt="">
        </div>
        <h2 id="dog-name">Dog-Name</h2>
        <div id="dog-details">
            <ul>
                <li>
                    <strong>Breed Group:</strong>
                    <p id="breed-group">something</p>
                </li>
                <li>
                    <strong>Bred For:</strong>
                    <p id="breed-for">something</p>
                </li>
                <li>
                    <strong>Life Span:</strong>
                    <p id="life-span">something</p>
                </li>
                <li>
                    <strong>Temperament:</strong>
                    <p id="temp">something</p>
                </li>
                <li>
                    <strong>Height:</strong>
                    <p id="Height">something</p>
                </li>
                <li>
                    <strong>Weight:</strong>
                    <p id="Weight">something</p>
                </li>
            </ul>
        </div>
        <button id="dog-btn">Get Random Dog</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
