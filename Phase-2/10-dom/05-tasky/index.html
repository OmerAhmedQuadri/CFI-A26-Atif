<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasky</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <h1>TODO LIST</h1>

                <li>
                    <p>tasky</p><button>Delete</button>

                    <p>flexy frog</p><button>Delete</button>
                </li>
            </ul>

        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
