<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile-card</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.8.0/axios.min.js"
        integrity="sha512-Rjx/Bee5UEvuxMc3Au6ShLf08nh+v4q3sNCI/+pSzypORWeVZG5jRZBKxM6RlA7L4hbHykwFXhmlBu/cJBaDRg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <div id="Profile-card">
        <div id="avatar">
            <img id="avatar-img" src="#" alt="">
        </div>
        <div id="Info">
            <h3 id="FullName">Fullname</h3>
            <h4>@<span id="user_name">User_name</span></h4>
            <p id="bio">Software Developer</p>
            <ul>
                <li id="email-li">
                    <img src="https://img.icons8.com/?size=100&id=12623&format=png&color=000000" alt="">
                    <p id="email">mailId</p>
                </li>
                <li>
                    <img src="https://img.icons8.com/?size=100&id=53430&format=png&color=000000" alt="">
                    <p id="location">location</p>
                </li>
                <li>
                    <img src="https://img.icons8.com/?size=100&id=9918&format=png&color=000000" alt="">
                    <a id="website" href="#" target="_blank">https://example.com</a> 
                </li>
                <li>
                    <img src="https://img.icons8.com/?size=100&id=33297&format=png&color=000000" alt="">
                    <p id="repo-count">0 repo-count</p>
                </li> 
            </ul>
        </div>
        <button id="profile-btn">View Profile</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
